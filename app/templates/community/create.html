{% extends "base.html" %}
{% block title %}Create Study Group · LDICA{% endblock %}
{% block content %}<section class="page-heading"><p class="eyebrow">COLLABORATION · NEW GROUP</p><h1>Create a study group</h1><p>Groups are private: members need the join code to participate.</p></section><form class="form-card stacked-form community-create-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Group name</label><input id="name" name="name" minlength="3" maxlength="100" required placeholder="e.g. LDICA revision group"><label for="description">Description</label><textarea id="description" name="description" maxlength="1000" rows="4" placeholder="Units covered, meeting plan, shared goals..."></textarea><div class="form-actions"><button class="button button-primary" type="submit">Create group</button><a class="button" href="{{ url_for('community.index') }}">Cancel</a></div></form>{% endblock %}
